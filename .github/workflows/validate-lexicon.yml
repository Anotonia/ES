name: Validate Spanish Lexicon

on:
  push:
    paths:
      - "data/**"
      - "mindmaps/**"
      - "docs/8000词候选库-分级与版权说明.md"
      - "scripts/validate_lexicon.py"
      - ".github/workflows/validate-lexicon.yml"
  pull_request:
    paths:
      - "data/**"
      - "mindmaps/**"
      - "docs/8000词候选库-分级与版权说明.md"
      - "scripts/validate_lexicon.py"
      - ".github/workflows/validate-lexicon.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate master vocabulary and frequency candidates
        run: python scripts/validate_lexicon.py
